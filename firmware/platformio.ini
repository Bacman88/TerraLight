; TerraLight firmware v2 — PlatformIO
; ESP32 Arduino core 3.3.x through the pioarduino platform
; (the official espressif32 platform for PlatformIO stays on core 2.x).

[platformio]
default_envs = esp32c3_supermini
src_dir = src

[env:esp32c3_supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Two OTA application slots of 1.9 MB each + NVS + small SPIFFS.
; The default layout (1.25 MB slots) is already 86 % full at M1 — Wi-Fi,
; HTTP and mDNS alone are ~1 MB; OTA over HTTPS adds more later.
board_build.partitions = min_spiffs.csv

; SuperMini has no USB-UART chip: serial runs over the native USB of the ESP32-C3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; Uncomment if the board sees networks but never connects (weak SuperMini antenna):
    ; -DTL_WIFI_TX_POWER=WIFI_POWER_8_5dBm

lib_deps =
    adafruit/Adafruit NeoPixel@^1.15.5
    bblanchon/ArduinoJson@^7.4.3

; Packs web/ (panel HTML/CSS/JS) into src/web/assets.h before every build
extra_scripts = pre:tools/build_assets.py
